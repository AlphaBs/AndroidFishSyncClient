name: Build
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AlphaBs/FishSyncClient
          ref: 79840441f8398a0934573664e58f07d9f1fe1caf
          path: .ci-upstream/FishSyncClient
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate original .NET contracts
        run: |
          original="$GITHUB_WORKSPACE/.ci-upstream/FishSyncClient/src/FishSyncClient.csproj"
          dotnet run --project tools/contract-reference -p:FishSyncOriginalProject="$original" -- fixtures/comparison-contract.json /tmp/comparison-reference.json
          cmp fixtures/comparison-contract.json /tmp/comparison-reference.json
          dotnet run --project tools/contract-reference -p:FishSyncOriginalProject="$original" -- --versions fixtures/generated-version-contract.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew checkKotlinStyle :fishsync-core:test :fishsync-client:test :fishsync-android:assembleDebug :sample-app:assembleDebug :sample-app:assembleRelease :sample-app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-contract-results
          path: |
            fishsync-core/build/test-results/
            fishsync-client/build/test-results/
            fixtures/generated-version-contract.json

  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.ci-android/user
      ANDROID_AVD_HOME: ${{ github.workspace }}/.ci-android/avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator image
        run: |
          sdkmanager "platform-tools" "emulator" "system-images;android-${{ matrix.api }};google_apis;x86_64"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name fishsync-ci --package "system-images;android-${{ matrix.api }};google_apis;x86_64" --path "$ANDROID_AVD_HOME/fishsync-ci.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds
      - name: Run SAF instrumented tests
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd fishsync-ci -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb shell input keyevent 82
          ./gradlew :fishsync-android:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results-api-${{ matrix.api }}
          path: |
            fishsync-android/build/reports/androidTests/
            fishsync-android/build/outputs/androidTest-results/
            /tmp/emulator.log
